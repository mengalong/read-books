server {
    listen 80;
    server_name books.mengalong.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name books.mengalong.cn;

    ssl_certificate /etc/letsencrypt/live/books.mengalong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.mengalong.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/read-books.access.log main;
    error_log /var/log/nginx/read-books.error.log warn;

    # PDF uploads are streamed to FastAPI and do not have an Nginx size limit.
    client_max_body_size 0;
    client_body_timeout 600s;

    location /api/ {
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
